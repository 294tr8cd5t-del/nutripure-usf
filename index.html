<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nutripure — USF Triathlon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #E8531A;
    --orange-light: #FFF0EA;
    --orange-mid: #F4834A;
    --dark: #1A1A1A;
    --mid: #4A4A4A;
    --muted: #888;
    --surface: #F7F5F2;
    --white: #FFFFFF;
    --border: #E8E4DE;
    --green: #2D7A3A;
    --green-light: #EAF4EC;
    --amber: #B86A00;
    --amber-light: #FFF8EA;
    --gray-light: #F0EEE9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Barlow', sans-serif;
    background: var(--surface);
    color: var(--dark);
    max-width: 480px;
    width: 100%;
    margin: 0 auto;
    min-height: 100vh;
    overflow-x: hidden; /* Empêche les débordements */
  }

  /* HEADER */
  .hero { background: var(--dark); padding: 28px 20px 24px; position: relative; overflow: hidden; }
  .hero::before { content: ''; position: absolute; top: -40px; right: -40px; width: 160px; height: 160px; border-radius: 50%; background: var(--orange); opacity: 0.15; }
  .hero-tag { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--orange-mid); margin-bottom: 6px; }
  .hero h1 { font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 700; color: #FFFFFF; line-height: 1.1; margin-bottom: 8px; }
  .hero h1 span { color: var(--orange-mid); }
  .hero-sub { font-size: 13px; color: rgba(255,255,255,0.55); line-height: 1.5; }
  .hero-pills { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .pill { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.7); }

  /* NAV TABS */
  .nav-wrap { background: var(--white); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
  .nav-tabs { display: flex; overflow-x: auto; scrollbar-width: none; padding: 0 12px; gap: 0; }
  .nav-tabs::-webkit-scrollbar { display: none; }
  .tab-btn { flex-shrink: 0; font-family: 'Barlow', sans-serif; font-size: 12px; font-weight: 600; padding: 12px 14px; border: none; background: transparent; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.2s, border-color 0.2s; white-space: nowrap; }
  .tab-btn.active { color: var(--orange); border-bottom-color: var(--orange); }

  /* SECTIONS */
  .section { display: none; padding: 16px; }
  .section.active { display: block; }

  /* SEARCH & PRODUCT CARD */
  .search-wrap { position: relative; margin-bottom: 16px; }
  #searchInput { width: 100%; padding: 10px 12px 10px 36px; border: 1px solid var(--border); border-radius: 8px; font-family: 'Barlow', sans-serif; font-size: 14px; }
  .product-card { background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 8px; display: flex; align-items: flex-start; gap: 12px; cursor: pointer; width: 100%; }
  .product-detail { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 13px; color: var(--mid); line-height: 1.6; }
  .product-card.expanded .product-detail { display: block; }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-tag">Club USF Triathlon · Catalogue officiel</div>
  <h1>Nutripure<br><span>Tarifs Club</span></h1>
  <div class="hero-sub">Produits sélectionnés par votre club au tarif partenaire.<br>Saison 2024–2025.</div>
  <div class="hero-pills">
    <div class="pill">🇫🇷 Marque française</div>
    <div class="pill">100% naturel</div>
  </div>
</div>

<div class="nav-wrap">
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="showTab('catalogue')">Catalogue</button>
    <button class="tab-btn" onclick="showTab('commande')">Commander</button>
  </div>
</div>

<div class="section active" id="tab-catalogue">
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Rechercher un produit..." oninput="filterProducts(this.value)">
  </div>
  <div id="productList">
    </div>
</div>

<script>
function showTab(name) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  event.target.classList.add('active');
}
function toggleCard(card) {
  card.classList.toggle('expanded');
}
function filterProducts(query) {
  const q = query.toLowerCase().trim();
  document.querySelectorAll('.product-card').forEach(card => {
    card.style.display = (!q || card.dataset.name.includes(q)) ? '' : 'none';
  });
}
</script>
</body>
</html>
