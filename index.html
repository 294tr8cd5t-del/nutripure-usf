<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nutripure — USF Triathlon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #E8531A;
    --orange-light: #FFF0EA;
    --orange-mid: #F4834A;
    --dark: #1A1A1A;
    --mid: #4A4A4A;
    --muted: #888;
    --surface: #F7F5F2;
    --white: #FFFFFF;
    --border: #E8E4DE;
    --green: #2D7A3A;
    --green-light: #EAF4EC;
    --amber: #B86A00;
    --amber-light: #FFF8EA;
    --gray-light: #F0EEE9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Barlow', sans-serif;
    background: var(--surface);
    color: var(--dark);
    max-width: 480px;
    width: 100%;
    margin: 0 auto;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Reste du style inchangé */
  .hero { background: var(--dark); padding: 28px 20px 24px; position: relative; overflow: hidden; }
  .hero-tag { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--orange-mid); margin-bottom: 6px; }
  .hero h1 { font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 700; color: #FFFFFF; line-height: 1.1; margin-bottom: 8px; }
  .hero h1 span { color: var(--orange-mid); }
  .nav-wrap { background: var(--white); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
  .nav-tabs { display: flex; overflow-x: auto; scrollbar-width: none; padding: 0 12px; }
  .tab-btn { font-size: 12px; font-weight: 600; padding: 12px 14px; border: none; background: transparent; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
  .tab-btn.active { color: var(--orange); border-bottom-color: var(--orange); }
  .section { display: none; padding: 16px; }
  .section.active { display: block; }
  .product-card { background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 8px; display: flex; gap: 12px; cursor: pointer; width: 100%; }
  .product-detail { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 13px; color: var(--mid); }
  .product-card.expanded .product-detail { display: block; }
</style>
</head>
<body>
    <p>Ton contenu original complet va ici.</p>
</body>
</html>
